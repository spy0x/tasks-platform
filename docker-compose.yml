services:
  mongo:
    image: mongo:7
    container_name: tasks-platform-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tasks_platform
    volumes:
      - mongo_data:/data/db
    security_opt:
      - apparmor=unconfined

  backend:
    build:
      context: ./backend
    container_name: tasks-platform-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/tasks_platform
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    security_opt:
      - apparmor=unconfined

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: tasks-platform-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    security_opt:
      - apparmor=unconfined

volumes:
  mongo_data:
